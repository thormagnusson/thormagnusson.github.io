<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fornbréfakort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --sea:#D6E0E3; --land:#EEF0E9; --coast:#8FA3A9; --ink:#1D2630; --ink2:#4E5B66; --rule:#B9C4C7;
  --seal:#9B2335; --seal-soft:#F2DADD; --lichen:#6F7F4C; --panel:#F8F9F6; --mark:#F3E3A6;
  --serif:'Spectral', Georgia, serif; --sans:'Albert Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#18232B; --land:#26313A; --coast:#4A5D66; --ink:#E4E8E6; --ink2:#A8B3B6; --rule:#3B4A52;
    --seal:#E0697B; --seal-soft:#4A2730; --lichen:#A9B87F; --panel:#1E2930; --mark:#5E5222;
  }
}
:root[data-theme="dark"]{
  --sea:#18232B; --land:#26313A; --coast:#4A5D66; --ink:#E4E8E6; --ink2:#A8B3B6; --rule:#3B4A52;
  --seal:#E0697B; --seal-soft:#4A2730; --lichen:#A9B87F; --panel:#1E2930; --mark:#5E5222;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sea);color:var(--ink);font-family:var(--sans);font-size:15px}
#map{position:fixed;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--sans)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* left legend column */
#side{position:fixed;left:16px;top:16px;bottom:16px;width:330px;display:flex;flex-direction:column;gap:12px;z-index:500;pointer-events:none}
#side > *{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:0 1px 0 var(--rule)}
#head{padding:14px 16px 12px}
#head h1{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
#head p{margin:4px 0 0;color:var(--ink2);font-size:13px}
#searchbox{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.qrow{display:flex;gap:6px}
#q{flex:1;padding:9px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--land);font-family:var(--serif);font-size:17px}
#q::placeholder{color:var(--ink2);font-style:italic}
.small{font-size:12.5px;color:var(--ink2)}
.years{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.years input{width:64px;padding:4px 6px;border:1px solid var(--rule);background:var(--land);border-radius:2px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
#legend{flex:1;overflow:auto;padding:6px 0}
#legend h2{font-family:var(--serif);font-weight:500;font-size:16px;margin:6px 16px 4px}
.cat{display:flex;align-items:baseline;gap:10px;width:100%;padding:5px 16px;border:0;background:none;text-align:left;cursor:pointer}
.cat .sw{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink2);flex:none;transform:translateY(1px)}
.cat .nm{flex:1}
.cat .is{color:var(--ink2);font-family:var(--serif);font-style:italic;font-size:13.5px}
.cat .ct{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}
.cat:hover{background:var(--land)}
.cat[aria-pressed="true"]{background:var(--seal-soft)}
.cat[aria-pressed="true"] .sw{background:var(--seal);border-color:var(--seal)}
#status{padding:10px 16px;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;align-items:center}
#status b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;color:var(--seal);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}

/* right reader */
#reader{position:fixed;right:16px;top:16px;bottom:16px;width:min(560px,calc(100vw - 380px));z-index:600;display:none;flex-direction:column}
#reader.open{display:flex}
#rtop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule)}
#rtop .t{flex:1;font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--rule);background:var(--land);border-radius:2px;padding:4px 10px;cursor:pointer;font-size:13px}
#rbody{overflow:auto;flex:1}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--rule)}
.list button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 16px;cursor:pointer}
.list button:hover{background:var(--land)}
.li-top{display:flex;gap:10px;align-items:baseline}
.li-y{font-family:var(--serif);font-weight:600;font-variant-numeric:oldstyle-nums;min-width:40px}
.li-t{font-family:var(--serif);font-size:15.5px;line-height:1.35}
.li-s{font-family:var(--serif);font-size:14px;color:var(--ink2);margin:4px 0 0 50px;line-height:1.4}
.li-m{font-size:12px;color:var(--ink2);margin:3px 0 0 50px}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:1px}

/* edition page */
.page{padding:22px 28px 40px;font-family:var(--serif)}
.page .no{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.page .no .n{font-size:22px;font-weight:600}
.page .no .d{font-size:16px;text-align:right}
.page .regest{font-size:16.5px;line-height:1.55;margin:0 0 14px;max-width:66ch}
.page .src{font-size:13.5px;color:var(--ink2);line-height:1.45;margin:0 0 18px}
dl.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 18px;font-family:var(--sans);font-size:13.5px}
dl.meta dt{color:var(--ink2)}
dl.meta dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:2px;padding:1px 7px;font-size:12.5px;background:var(--land);cursor:pointer}
.chip.on{border-color:var(--seal);color:var(--seal)}
.ptext{font-family:var(--serif);white-space:pre-wrap;font-size:15.5px;line-height:1.62;margin:0;max-width:68ch;font-variant-ligatures:common-ligatures}
.ptext .hl{background:linear-gradient(transparent 60%, var(--seal-soft) 60%)}
.pdfa{display:inline-block;margin:4px 0 16px;color:var(--seal);font-family:var(--sans);font-size:13.5px}
.note{font-family:var(--sans);font-size:12.5px;color:var(--ink2);border-left:2px solid var(--rule);padding-left:10px;margin:18px 0}

/* map bits */
.leaflet-tooltip.pt{font-family:var(--serif);font-size:14px;border-radius:2px;border-color:var(--rule);background:var(--panel);color:var(--ink);box-shadow:none}
.leaflet-control-layers,.leaflet-bar a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--ink2)!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2000;background:var(--sea);font-family:var(--serif);font-size:20px;color:var(--ink2)}

@media (max-width:820px){
  #side{left:8px;right:8px;top:8px;bottom:auto;width:auto;gap:6px}
  #head{padding:8px 12px}#head h1{font-size:20px}#head p,#hint{display:none}
  #searchbox{padding:8px 12px;gap:6px}
  #legend{max-height:22vh}
  #status{padding:6px 12px}
  body.reading #legend,body.reading #searchbox .years{display:none}
  #reader{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:50vh}
  .page{padding:16px 16px 30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loading">Sæki bréfin…</div>
<div id="map" aria-label="Kort af Íslandi"></div>

<aside id="side">
  <div class="card" id="head">
    <h1>Fornbréfakort</h1>
    <p>Staðir, orð og hlutir í Íslenzku fornbréfasafni, 1.–16. bindi</p>
  </div>
  <div class="card" id="searchbox">
    <div class="qrow">
      <input id="q" type="search" placeholder="Leitaðu að orði, t.d. skreið, þang, Hólum" aria-label="Leita í bréfunum" autocomplete="off">
    </div>
    <div class="years">
      <span class="small">Ár</span>
      <input id="y0" type="number" aria-label="Frá ári"> <span class="small">til</span> <input id="y1" type="number" aria-label="Til árs">
      <label class="chk" style="margin-left:auto"><input type="checkbox" id="exact"> Heilt&nbsp;orð</label>
    </div>
    <div class="small" id="hint">Stafsetning er samræmd, svo <i>bok</i> finnur líka <i>bók</i>, <i>bækur</i> og <i>bokum</i>.</div>
  </div>
  <div class="card" id="legend" role="group" aria-label="Efnisflokkar">
    <h2>Efnisflokkar</h2>
    <div id="cats"></div>
  </div>
  <div class="card" id="status"><span id="stat">—</span><button class="linkbtn" id="clear" hidden>Hreinsa</button></div>
</aside>

<section id="reader" class="card" aria-live="polite">
  <div id="rtop"><button class="iconbtn" id="back" hidden>Til baka</button><div class="t" id="rtitle"></div><button class="iconbtn" id="close" aria-label="Loka spjaldinu">Loka</button></div>
  <div id="rbody"></div>
</section>

<script src="vendor/leaflet.js"></script>
<script src="data.js"></script>
<script>
(function(){
const D = window.DI, P = D.places, LET = D.letters, META = D.meta;
const PDF = v => `../Diplomatarium_Islandicum___Bindi_${v}.pdf`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- normalisation (mirrors enrich.py) ---------- */
function norm(s){
  s = s.toLowerCase().replace(/æ|ǽ|œ/g,'ae').replace(/[øǫ]/g,'o').replace(/[ðđ]/g,'d')
       .replace(/w/g,'v').replace(/y/g,'i').replace(/j/g,'i').replace(/c/g,'k').replace(/z/g,'s');
  s = s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  s = s.replace(/([a-zþ])\1+/g,'$1').replace(/ii/g,'i');
  return s;
}
const W0 = '(?<![a-z0-9þ])', W1 = '(?![a-z0-9þ])';
const jsrx = p => p.replace(/^\\b/, '').replace(/\\b/g, W1);
const CAT = {}; META.categories.forEach(c => CAT[c.k] = Object.assign(c, {rx: new RegExp(W0 + '(?:' + c.p.map(jsrx).join('|') + ')')}));

/* ---------- precompute ---------- */
LET.forEach(o => { o.lines = (o.txt || '').split('\n').map(l => l.replace(/^ {5,}/, '    ')); });
let normed = false;
function ensureNorm(){ if (normed) return; LET.forEach(o => { o.nl = o.lines.map(norm); o.nh = norm((o.r||'')+' '+(o.t||'')+' '+(o.sn||'')); }); normed = true; }
const YMIN = 834, YMAX = 1600;
$('#y0').value = YMIN; $('#y1').value = YMAX;

/* ---------- map ---------- */
const map = L.map('map', {zoomControl:false, attributionControl:true, minZoom:3, maxZoom:14, zoomSnap:.25}).setView([64.95,-18.6], 6.4);
L.control.zoom({position:'bottomright'}).addTo(map);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const outline = L.geoJSON(META.iceland, {style:()=>({color:css('--coast'), weight:1, fillColor:css('--land'), fillOpacity:1}), interactive:false});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom:15, attribution:'© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)', opacity:.75});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap contributors', opacity:.8});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:17, attribution:'Imagery © Esri'});
outline.addTo(map);
L.control.layers({'Strandlína (virkar án nets)': L.layerGroup(), 'Landslag (OpenTopoMap)': topo, 'Götukort (OSM)': osm, 'Gervihnattamynd (Esri)': sat}, null, {position:'bottomright'}).addTo(map);
map.attributionControl.setPrefix('Örnefni: Landmælingar Íslands (IS 50V) og Staðfangaskrá, um iceaddr');

const base = L.layerGroup().addTo(map), hits = L.layerGroup().addTo(map);
const placeLetters = {};
LET.forEach((o,i) => Object.keys(o.pl||{}).forEach(k => (placeLetters[k] ||= []).push(i)));

function drawBase(){
  base.clearLayers();
  for (const [k,p] of Object.entries(P)){
    const n = placeLetters[k]?.length || 0; if (!n) continue;
    const m = L.circleMarker([p.la,p.lo], {radius: 1.6 + Math.sqrt(n)*0.55, color: css('--ink2'), weight: .6, fillColor: css('--ink2'), fillOpacity: .35, opacity:.6});
    m.bindTooltip(`${esc(p.n)} <span style="color:${css('--ink2')}">· ${n}</span>`, {className:'pt', direction:'top', offset:[0,-4]});
    m.on('click', () => openPlace(k));
    base.addLayer(m);
  }
}

/* ---------- state + search ---------- */
const state = {q:'', cats:new Set(), y0:YMIN, y1:YMAX, exact:false};
let result = null;   // {letters: Map(idx -> {lines:Set, places:Set}), byPlace: Map(k -> [idx])}

function queryRx(){
  const words = norm(state.q).split(/\s+/).filter(w => w.length > 1).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return words.map(w => new RegExp(W0 + w + (state.exact ? W1 : '')));
}
function nearPlaces(o, hitLines){
  const out = new Set(); const entries = Object.entries(o.pl||{});
  if (!entries.length) return out;
  const hl = [...hitLines];
  for (const [k, lns] of entries) if (lns.some(m => hl.some(h => Math.abs(m-h) <= 6))) out.add(k);
  if (!out.size) entries.forEach(([k]) => out.add(k));
  return out;
}
function run(){
  const active = state.q.trim().length > 1 || state.cats.size;
  hits.clearLayers();
  if (!active){ result = null; base.eachLayer(l => l.setStyle({opacity:.6, fillOpacity:.35})); status(); return; }
  ensureNorm();
  const qrx = queryRx(); const cats = [...state.cats];
  const letters = new Map(), byPlace = new Map();
  LET.forEach((o,i) => {
    if (o.y && (o.y < state.y0 || o.y > state.y1)) return;
    const lines = new Set();
    for (const rx of qrx){
      let any = rx.test(o.nh);
      o.nl.forEach((l,j) => { if (rx.test(l)){ lines.add(j); any = true; } });
      if (!any) return;
    }
    for (const c of cats){
      const cc = o.c && o.c[c]; if (!cc) return;
      cc.l.forEach(j => lines.add(j));
    }
    const places = nearPlaces(o, lines);
    letters.set(i, {lines, places});
    places.forEach(k => { if (!byPlace.has(k)) byPlace.set(k, []); byPlace.get(k).push(i); });
  });
  result = {letters, byPlace};
  base.eachLayer(l => l.setStyle({opacity:.25, fillOpacity:.12}));
  const seal = css('--seal');
  for (const [k, idx] of byPlace){
    const p = P[k];
    const m = L.circleMarker([p.la,p.lo], {radius: 4 + Math.sqrt(idx.length)*2.1, color: seal, weight: 1.2, fillColor: seal, fillOpacity: .55});
    m.bindTooltip(`${esc(p.n)} · ${idx.length} bréf`, {className:'pt', direction:'top', offset:[0,-6]});
    m.on('click', () => openPlace(k));
    hits.addLayer(m);
  }
  status();
  showList();
}
function status(){
  const n = result ? result.letters.size : LET.length, pl = result ? result.byPlace.size : Object.keys(P).length;
  const unplaced = result ? [...result.letters.values()].filter(v => !v.places.size).length : 0;
  $('#stat').innerHTML = result
    ? `<b>${n.toLocaleString('is-IS')}</b> bréf á <b>${pl.toLocaleString('is-IS')}</b> stöðum${unplaced ? `, ${unplaced} án staðsetningar á korti` : ''}`
    : `<b>${n.toLocaleString('is-IS')}</b> skjöl, <b>${pl.toLocaleString('is-IS')}</b> staðir`;
  $('#clear').hidden = !result;
}

/* ---------- categories legend ---------- */
const catCount = {}; LET.forEach(o => Object.keys(o.c||{}).forEach(k => catCount[k] = (catCount[k]||0)+1));
$('#cats').innerHTML = META.categories.map(c =>
  `<button class="cat" data-k="${c.k}" aria-pressed="false"><span class="sw"></span><span class="nm">${esc(c.is_)}</span><span class="ct">${catCount[c.k]||0}</span></button>`).join('');
$('#cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  const k = b.dataset.k;
  state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k);
  b.setAttribute('aria-pressed', state.cats.has(k));
  run(); saveHash();
});

/* ---------- reader panel ---------- */
const reader = $('#reader'); let viewStack = [];
function openPanel(title, html, push=true){
  if (push && reader.classList.contains('open')) viewStack.push([$('#rtitle').textContent, $('#rbody').innerHTML, $('#rbody').scrollTop]);
  $('#rtitle').textContent = title; $('#rbody').innerHTML = html; $('#rbody').scrollTop = 0;
  reader.classList.add('open'); document.body.classList.add('reading'); $('#back').hidden = !viewStack.length;
}
$('#back').onclick = () => { const v = viewStack.pop(); if (!v) return; $('#rtitle').textContent = v[0]; $('#rbody').innerHTML = v[1]; $('#rbody').scrollTop = v[2]; $('#back').hidden = !viewStack.length; };
$('#close').onclick = () => { reader.classList.remove('open'); document.body.classList.remove('reading'); viewStack = []; };
$('#rbody').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (b) { openLetter(+b.dataset.i); return; }
  const c = e.target.closest('[data-place]'); if (c) { openPlace(c.dataset.place); const p=P[c.dataset.place]; map.flyTo([p.la,p.lo], Math.max(map.getZoom(), 9), {duration:.6}); }
});

function hlWords(line, rxs){
  // highlight words whose normalised form matches any regex
  return line.split(/(\s+)/).map(w => {
    if (!w.trim()) return w;
    const n = norm(w.replace(/[^\p{L}\p{N}\-]/gu, '')) + ' ';
    return rxs.some(rx => rx.test(' ' + n)) ? `<mark>${esc(w)}</mark>` : esc(w);
  }).join('');
}
function activeRx(){
  const r = queryRx();
  state.cats.forEach(c => r.push(CAT[c].rx));
  return r;
}
function snippet(o, lines, rxs){
  const j = [...lines].sort((a,b)=>a-b)[0];
  if (j === undefined) return '';
  const s = o.lines.slice(Math.max(0,j-1), j+2).map(x => x.trim()).join(' ').slice(0, 300);
  return hlWords(s, rxs);
}
function liHTML(i, info, rxs){
  const o = LET[i];
  const title = o.sn ? `${o.sn} (máldagi, hluti ${o.s})` : (stripDate(o.t) || stripDate(o.r) || '(án titils)');
  const where = o.pik ? P[o.pik].n : (o.pi || '');
  return `<li><button data-i="${i}"><div class="li-top"><span class="li-y">${o.y||'—'}</span><span class="li-t">${esc(title).slice(0,220)}</span></div>
    ${info && info.lines.size ? `<div class="li-s">…${snippet(o, info.lines, rxs)}…</div>` : ''}
    <div class="li-m">DI ${o.v}, nr. ${o.n}${where ? ' · ' + esc(where) : ''}${o.lang && o.lang!=='Íslenska' ? ' · ' + o.lang : ''}</div></button></li>`;
}
const DW = /^([\[\(\]\)]|\[?\(?\d{1,4}[\.,\]\)]*\.?|um|c\.|ca\.|eða|og|síðar|siðar|fyrir|eptir|eftir|[—–-].*|\?|(jan|feb|eeb|mar|apr|maí|mai|jún|jun|júl|jul|aug|ág|sep|okt|oct|nóv|nov|des|dec|dez)[a-zúíóáé]*\.?,?)$/i;
function stripDate(t){ const w = (t||'').split(/\s+/); let i = 0; while (i < w.length && DW.test(w[i])) i++; return w.slice(i).join(' '); }

function showList(){
  if (!result) return;
  const rxs = activeRx();
  const idx = [...result.letters.keys()].sort((a,b) => (LET[a].y||9999) - (LET[b].y||9999));
  const what = [state.q.trim() && `„${state.q.trim()}“`, ...[...state.cats].map(c => CAT[c].is_.toLowerCase())].filter(Boolean).join(' + ');
  viewStack = [];
  if (!idx.length){ openPanel(`Engin bréf: ${what}`, `<p class="note" style="margin:18px">Ekkert bréf á völdu tímabili svarar til ${esc(what)}. Prófaðu styttri orðstofn (t.d. <i>org</i> í stað <i>orgel</i>), víkkaðu tímabilið eða taktu af flokk.</p>`, false); return; }
  openPanel(`${idx.length} bréf: ${what}`, `<ul class="list">${idx.slice(0,400).map(i => liHTML(i, result.letters.get(i), rxs)).join('')}</ul>${idx.length>400?`<p class="note" style="margin:16px">Hér sjást fyrstu 400 bréfin eftir ártali. Þrengdu tímabilið eða smelltu á stað á kortinu til að sjá hin.</p>`:''}`, false);
}
function openPlace(k){
  const p = P[k]; const rxs = activeRx();
  let idx = result ? (result.byPlace.get(k) || []) : (placeLetters[k] || []);
  idx = [...idx].sort((a,b) => (LET[a].y||9999) - (LET[b].y||9999));
  const conf = {unique:'eini staðurinn með þessu nafni', qualified:'greind út frá nánari tilgreiningu, t.d. „í Öræfum“', context:'valinn sá samnefndi staður sem næstur er öðrum stöðum í sömu bréfum', curated:'þekktur sögustaður', weak:'óviss, enginn samnefndur staður er nálægt hinum stöðunum í bréfinu', guess:'óviss, besta ágiskun meðal samnefndra staða', foreign:'utan Íslands'}[p.c] || '';
  const html = `<div class="page" style="padding-bottom:6px"><div class="no"><span class="n">${esc(p.n)}</span><span class="d small">${p.la.toFixed(3)}, ${p.lo.toFixed(3)}</span></div>
     <p class="src">${idx.length} ${result?'samsvarandi ':''}${idx.length===1?'skjal':'skjöl'}. Staðsetning: ${conf}.</p></div>
     <ul class="list">${idx.map(i => liHTML(i, result && result.letters.get(i), rxs)).join('')}</ul>`;
  openPanel(p.n, html);
}
function openLetter(i){
  const o = LET[i]; const info = result && result.letters.get(i); const rxs = activeRx();
  const hl = new Set(info ? info.lines : []);
  const text = o.lines.map((l,j) => hl.has(j) ? `<span class="hl">${hlWords(l, rxs)}</span>` : esc(l)).join('\n');
  const places = Object.keys(o.pl||{}).map(k => `<span class="chip${info && info.places.has(k) ? ' on':''}" data-place="${esc(k)}" role="button" tabindex="0">${esc(P[k].n)}</span>`).join('');
  const cats = Object.keys(o.c||{}).map(c => `<span class="chip" title="${esc(o.c[c].t.join(', '))}">${esc(CAT[c].is_)}</span>`).join('');
  const issued = o.pik ? `${esc(P[o.pik].n)}${o.pi ? ` <span class="small">(${esc(o.pi)})</span>` : ''}` : esc(o.pi || '');
  const html = `<article class="page">
    <div class="no"><span class="n">${o.n}.${o.s ? ' ' + o.s + '.' : ''}</span><span class="d">${esc(o.d || o.y || '')}${issued ? '<br>' + issued : ''}</span></div>
    ${o.sn ? `<p class="regest"><i>${esc(o.sn)}</i></p>` : ''}
    <p class="regest">${hlWords(o.r || o.t || '', rxs)}</p>
    ${o.src ? `<p class="src">${esc(o.src)}</p>` : ''}
    <dl class="meta">
      <dt>Ár</dt><dd>${o.y || 'óþekkt'}</dd>
      <dt>Dagsetning</dt><dd>${esc(o.d || '')}</dd>
      <dt>Útgáfustaður</dt><dd>${issued || '—'}</dd>
      <dt>Útgefandi</dt><dd>${esc(o.a || '—')}</dd>
      <dt>Tegund</dt><dd>${esc(o.ty || '—')}</dd>
      <dt>Tungumál</dt><dd>${esc(o.lang || '—')}</dd>
      <dt>Útgáfa</dt><dd>DI ${o.v}, nr. ${o.n}${o.bp ? `, bls. ${o.bp}` : ''} <span class="small">(${esc(META.volumes[o.v]?.replace('Diplomatarium Islandicum = ','') || '')})</span></dd>
      <dt>Staðir</dt><dd><div class="chips">${places || '—'}</div></dd>
      <dt>Efnisflokkar</dt><dd><div class="chips">${cats || '—'}</div></dd>
    </dl>
    <a class="pdfa" href="${PDF(o.v)}#page=${o.pp}" target="_blank" rel="noopener">Opna skannaða síðu í PDF-skjalinu (${o.v}. bindi, bls. ${o.pp} í PDF)</a>
    <pre class="ptext">${text}</pre>
    <p class="note">Textinn er ljóslestur (OCR) Landsbókasafns á prentuðu útgáfunni og í honum eru lesvillur. Berið saman við myndina áður en vitnað er í hann. Útgefandi og tegund eru lesin úr efniságripi útgáfunnar.</p>
  </article>`;
  openPanel(`DI ${o.v}.${o.n}${o.s ? '.' + o.s : ''} · ${o.y || ''}`, html);
  const sel = Object.keys(o.pl||{}).filter(k => (!info || info.places.has(k)) && !P[k].f);
  if (sel.length){ const b = L.latLngBounds(sel.map(k => [P[k].la, P[k].lo])); if (!map.getBounds().contains(b)) map.flyToBounds(b.pad(.4), {maxZoom: 9, duration:.6}); }
}

/* ---------- inputs ---------- */
let t; $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { state.q = $('#q').value; run(); saveHash(); }, 280); });
['#y0','#y1'].forEach(s => $(s).addEventListener('change', () => { state.y0 = +$('#y0').value || YMIN; state.y1 = +$('#y1').value || YMAX; run(); saveHash(); }));
$('#exact').addEventListener('change', e => { state.exact = e.target.checked; run(); saveHash(); });
$('#clear').onclick = () => { state.q=''; $('#q').value=''; state.cats.clear(); document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed','false')); run(); saveHash(); reader.classList.remove('open'); };
function saveHash(){ const h = new URLSearchParams(); if (state.q) h.set('q', state.q); if (state.cats.size) h.set('c', [...state.cats].join(',')); if (state.y0!==YMIN) h.set('y0',state.y0); if (state.y1!==YMAX) h.set('y1',state.y1); if (state.exact) h.set('x','1'); history.replaceState(null,'','#'+h); }
function loadHash(){ const h = new URLSearchParams(location.hash.slice(1)); state.q = h.get('q')||''; $('#q').value = state.q; (h.get('c')||'').split(',').filter(c=>CAT[c]).forEach(c => { state.cats.add(c); document.querySelector(`.cat[data-k="${c}"]`).setAttribute('aria-pressed','true'); }); state.y0 = +h.get('y0')||YMIN; state.y1 = +h.get('y1')||YMAX; $('#y0').value=state.y0; $('#y1').value=state.y1; state.exact = h.get('x')==='1'; $('#exact').checked = state.exact; }

drawBase(); loadHash(); run(); $('#loading').remove();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { outline.setStyle({color:css('--coast'), fillColor:css('--land')}); drawBase(); run(); });
})();
</script>
